<!-- THREADS-STYLE POST COMPOSER (replaces cam-preview) -->
<div class="cam-preview" id="cam-pr">
  <!-- Header -->
  <div class="tc-header">
    <button class="tc-cancel" onclick="retake()">Cancel</button>
    <h2 class="tc-title">New thread</h2>
    <div class="tc-header-actions">
      <button class="tc-icon-btn" title="Save draft" onclick="saveDraft()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button class="tc-icon-btn" title="Emoji" onclick="showEmojiPicker()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </button>
    </div>
  </div>

  <!-- Scrollable content area -->
  <div class="tc-scroll">
    <!-- Add music button (when no music selected) -->
    <div class="tc-music-row" id="tc-music-add" onclick="openMusicPicker()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>Add music</span>
    </div>

    <!-- Selected music preview (hidden by default) -->
    <div class="tc-music-selected" id="tc-music-sel" style="display:none">
      <img id="tc-music-art" src="" alt="">
      <div class="tc-music-info">
        <div class="tc-music-title" id="tc-music-t">Song Title</div>
        <div class="tc-music-artist" id="tc-music-a">Artist</div>
      </div>
      <button class="tc-music-x" onclick="clearMusic()">×</button>
    </div>

    <!-- Media preview -->
    <div class="tc-media-wrap" id="tc-media-wrap">
      <div id="cam-multi-strip" style="display:none;width:100%;gap:8px;padding:0 0 12px;overflow-x:auto;white-space:nowrap;margin-bottom:8px"></div>
      <div class="tc-img-wrap" id="tc-img-wrap" style="display:none">
        <img id="cam-pi" src="">
        <button class="tc-img-x" onclick="removeMedia()">×</button>
      </div>
      <video id="cam-pv" style="display:none;max-width:92%;max-height:40vh;border-radius:16px" controls playsinline></video>
    </div>

    <!-- Composer row -->
    <div class="tc-composer">
      <div class="tc-avatar" id="tc-avatar"></div>
      <div class="tc-input-wrap">
        <textarea id="cam-cap" class="tc-textarea" placeholder="Start a thread..."></textarea>
        <!-- Font & color tools -->
        <div class="tc-tools">
          <select class="font-select" id="cam-font-picker" onchange="pickCamFont(this,this.value)">
            <option value="font-inter" selected>Normal</option>
            <option value="font-comic">Comic Sans</option>
            <option value="font-mono">Monospace</option>
            <option value="font-hand">Handwriting</option>
            <option value="font-gothic">Gothic</option>
            <option value="font-dont">Don't</option>
          </select>
          <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap" id="cam-color-picker">
            <button class="font-opt a" style="background:#DEDAD2" onclick="pickCamColor(this,'#DEDAD2')" title="Default"></button>
            <button class="font-opt" style="background:#FFD700" onclick="pickCamColor(this,'#FFD700')" title="Gold"></button>
            <button class="font-opt" style="background:#FF6B6B" onclick="pickCamColor(this,'#FF6B6B')" title="Red"></button>
            <button class="font-opt" style="background:#6BCB77" onclick="pickCamColor(this,'#6BCB77')" title="Green"></button>
            <button class="font-opt" style="background:#4D96FF" onclick="pickCamColor(this,'#4D96FF')" title="Blue"></button>
            <button class="font-opt" style="background:#C084FC" onclick="pickCamColor(this,'#C084FC')" title="Purple"></button>
            <button class="font-opt" style="background:#FF8C42" onclick="pickCamColor(this,'#FF8C42')" title="Orange"></button>
            <button class="font-opt" style="background:#00D9FF" onclick="pickCamColor(this,'#00D9FF')" title="Cyan"></button>
            <button class="font-opt" style="background:#FF69B4" onclick="pickCamColor(this,'#FF69B4')" title="Pink"></button>
            <button class="font-opt" style="background:#8B4513" onclick="pickCamColor(this,'#8B4513')" title="Brown"></button>
            <input type="color" class="font-opt" style="width:36px;height:36px;padding:0;border:none;cursor:pointer;border-radius:10px" onchange="pickCamColor(this,this.value)" title="Custom color">
          </div>
          <span class="premium-lock" id="cam-color-lock" style="display:none">⭐ Premium only</span>
        </div>
      </div>
    </div>

    <!-- Add to thread -->
    <div class="tc-add-thread" onclick="addToThread()">
      <div class="tc-thread-avatar" id="tc-thread-avatar"></div>
      <span>Add to thread</span>
    </div>

    <!-- Location -->
    <div class="tc-location" onclick="getLocation('cam-loc')">
      <input type="text" id="cam-loc" placeholder="📍 Add location" readonly title="Tap to get your real location">
    </div>
  </div>

  <!-- Bottom toolbar -->
  <div class="tc-toolbar">
    <div class="tc-toolbar-left">
      <button class="tc-tool-btn" onclick="triggerFileInput()" title="Photo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <button class="tc-tool-btn" onclick="openGifPicker()" title="GIF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><text x="4" y="17" font-family="sans-serif" font-size="12" font-weight="bold" fill="currentColor">GIF</text></svg>
      </button>
      <button class="tc-tool-btn" onclick="openMusicPicker()" title="Music">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="tc-tool-btn" onclick="openPollComposer()" title="Poll">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </button>
      <button class="tc-tool-btn" onclick="showMoreOptions()" title="More">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
  </div>

  <!-- Post options bar -->
  <div class="tc-post-bar">
    <button class="tc-post-opt" onclick="showPostOptions()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 21 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Post Options
    </button>
    <label class="tc-toggle-wrap">
      <span>Anyone can reply</span>
      <input type="checkbox" id="tc-reply-toggle" checked>
      <span class="tc-toggle"></span>
    </label>
    <button class="btn btn-primary tc-post-btn" onclick="postCam()">Post</button>
  </div>

  <!-- Premium actions -->
  <div class="cam-premium-actions" id="cam-premium-actions" style="display:none;gap:8px;margin-top:10px;justify-content:center">
    <button class="btn btn-outline btn-sm" onclick="addToStory()" style="border-color:var(--gold);color:var(--gold)">📸 Add to Story</button>
    <button class="btn btn-outline btn-sm" onclick="openLiveModal()" style="border-color:#FF3366;color:#FF3366">🔴 Go Live</button>
  </div>
</div>
